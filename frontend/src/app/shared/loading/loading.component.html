@if (loadingService.cargando()) {
  <div class="loading-overlay">
    <div class="loading-container">
      <div class="spinner-wrapper">
        <!-- SVG del Spinner y Bicho UTN-BUGS -->
        <svg class="bug-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
          <!-- Capa 1: Halo orbital giratorio -->
          <g class="spinner-orbit">
            <circle class="spinner-ring" cx="24" cy="24" r="22" stroke="var(--border-subtle)" stroke-width="2" />
            <circle class="spinner-track" cx="24" cy="24" r="22" stroke="var(--accent-primary)" stroke-width="2" stroke-dasharray="35 105" stroke-linecap="round" />
          </g>

          <!-- Capa 2: Bicho Chip Cyberpunk (estático con pulso de luz) -->
          <g class="bug-core">
            <!-- Antenas con terminales LED -->
            <path d="M20 15 L16 9 L12 10" class="bug-antenna" stroke="var(--accent-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="12" cy="10" r="1.2" class="bug-node" fill="var(--accent-primary)" />

            <path d="M28 15 L32 9 L36 10" class="bug-antenna" stroke="var(--accent-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="36" cy="10" r="1.2" class="bug-node" fill="var(--accent-primary)" />

            <!-- Patas de circuito integradas -->
            <path d="M16 23 L10 21 L8 24" class="bug-leg" stroke="var(--accent-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M15 28 L9 29 L7 34" class="bug-leg" stroke="var(--accent-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M16 33 L10 36 L9 41" class="bug-leg" stroke="var(--accent-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

            <path d="M32 23 L38 21 L40 24" class="bug-leg" stroke="var(--accent-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M33 28 L39 29 L41 34" class="bug-leg" stroke="var(--accent-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M32 33 L38 36 L39 41" class="bug-leg" stroke="var(--accent-primary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Chasis / Caparazón hexagonal -->
            <polygon points="18,21 24,17 30,21 33,31 24,39 15,31" class="bug-chassis" fill="var(--bg-app)" stroke="var(--accent-primary)" stroke-width="1.8" stroke-linejoin="round" />

            <!-- Núcleo de bus de datos interior -->
            <line x1="24" y1="20" x2="24" y2="35" class="bug-bus" stroke="var(--accent-primary)" stroke-width="1.2" stroke-dasharray="2 1.5" />
            <polyline points="20,27 24,30 28,27" class="bug-bus" stroke="var(--accent-primary)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

            <!-- Cabeza tecnológica con visor angular -->
            <polygon points="20,18 24,14 28,18" class="bug-head" fill="var(--bg-card)" stroke="var(--accent-primary)" stroke-width="1.5" stroke-linejoin="round" />
            <polygon points="21,17 23,16 23,17 21,18" class="bug-eye" fill="var(--accent-primary)" />
            <polygon points="27,17 25,16 25,17 27,18" class="bug-eye" fill="var(--accent-primary)" />
          </g>
        </svg>
      </div>
      <p class="loading-text">{{ loadingService.mensaje() }}</p>
    </div>
  </div>
}
